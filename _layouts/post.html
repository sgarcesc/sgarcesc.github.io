---
layout: default
---
<article class="wrap post">
  <header>
    <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p><a href="{{ '/#writing' | relative_url }}">&larr; All writing</a></p>
</article>
