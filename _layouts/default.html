<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="{{ page.layout }}">
  <header class="site-header">
    <nav class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">SG</a>
      <div class="nav-links">
        {% if site.posts.size > 0 %}<a href="{{ '/#writing' | relative_url }}">Writing</a>{% endif %}
        <a href="{{ '/#about' | relative_url }}">About</a>
      </div>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="ornament" aria-hidden="true">❦</span>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }} &middot; Not all those who wander are lost.</p>
    </div>
  </footer>
</body>
</html>
